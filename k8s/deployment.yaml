apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins-eks-demo
  namespace: demo
  labels:
    app: jenkins-eks-demo
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: jenkins-eks-demo
  template:
    metadata:
      labels:
        app: jenkins-eks-demo
    spec:
      containers:
        - name: jenkins-eks-demo
          # IMAGE_PLACEHOLDER is replaced by Jenkins with
          # <dockerhub-user>/jenkins-eks-demo:<build-number>
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
